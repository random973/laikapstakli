<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>Laikapstākļi — mana lapa</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
  input, button { padding: 8px; font-size: 15px; }
  #kartite { border: 1px solid #ccc; border-radius: 10px; padding: 16px; margin-top: 16px; }
  .liels { font-size: 40px; font-weight: bold; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #ddd; padding: 6px 10px; }
  .kluda { color: #c00; }
</style>
</head>
<body>
<h1>Laikapstākļi</h1>

<input id="pilseta"
       placeholder="Pilsēta, piem. Mārupe"
       value="Mārupe"
       onkeydown="if (event.key === 'Enter') raditLaiku()">
<button onclick="raditLaiku()">Rādīt</button>

<div id="kartite">Ievadi pilsētu un nospied "Rādīt".</div>

<script>
// 1. SOLIS — pilsētas nosaukums → koordinātas (Open-Meteo Geocoding API)
async function atrastKoordinatas(nosaukums) {
  if (document.getElementById('pilseta').value != "") {
    const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(nosaukums) + '&count=1&language=lv';
  const res = await fetch(url);
  const data = await res.json();
  if (!data.results) return null;              // nav atrasts
  return data.results[0];     
  }                  // { name, latitude, longitude, country, ... }
}

// 2. SOLIS — koordinātas → laikapstākļi (Open-Meteo Forecast API)
async function dabutLaiku(lat, lon) {
  if (document.getElementById('pilseta').value != "") {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat + '&longitude=' + lon
      + '&current=temperature_2m,wind_speed_10m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min'
      + '&timezone=Europe%2FRiga&forecast_days=3';

    const res = await fetch(url);
    return await res.json();
  }
}

// 3. SOLIS — parādīt HTML
async function raditLaiku() {
  const kartite = document.getElementById('kartite');
const pilseta = document.getElementById('pilseta').value.trim();

if (pilseta === "") {
  kartite.innerHTML = '<span class="kluda">Lūdzu, ievadi pilsētas nosaukumu!</span>';
  return;
}

kartite.innerHTML = 'Ielādē…';
  try {
    const vieta = await atrastKoordinatas(document.getElementById('pilseta').value);
    if (!vieta) {
      kartite.innerHTML = '<span class="kluda">Pilsēta nav atrasta</span>';
      return;
    }

    const laiks = await dabutLaiku(vieta.latitude, vieta.longitude);
    console.log(laiks);   // paskaties konsolē, kas atnāca!

    kartite.innerHTML = `
      <h2>${vieta.name}, ${vieta.country}</h2>
      <div class="liels">${laiks.current.temperature_2m} °C</div>
      <div>Vējš: ${laiks.current.wind_speed_10m} km/h</div>
    `;

    // UZDEVUMS: pievieno 3 dienu prognozes tabulu no laiks.daily
  let tabula = `
  <table>
    <tr>
      <th>Datums</th>
      <th>Max. temperatūra</th>
      <th>Min. temperatūra</th>
    </tr>
  `;
  
  for (let i = 0; i < 3; i++) {
    tabula += `
    <tr>
      <td>${laiks.daily.time[i]}</td>
      <td>${laiks.daily.temperature_2m_max[i]} °C</td>
      <td>${laiks.daily.temperature_2m_min[i]} °C</td>
    </tr>
  `;
  }

  
function laikaApraksts(code) {
  if (code === 0) return "Skaidrs";
  if (code >= 1 && code <= 3) return "Mākoņains";
  if (code >= 45 && code <= 48) return "Migla";
  if (code >= 51 && code <= 67) return "Lietus";
  if (code >= 71 && code <= 77) return "Sniegs";
  if (code >= 95) return "Pērkons";

  return "Nezināmi laikapstākļi";
}

kartite.innerHTML += `
  <p>Laika apraksts: ${laikaApraksts(laiks.current.weather_code)}</p>
`;

// Aizveram tabulu un parādām to lapā
tabula += `</table>`;
kartite.innerHTML += tabula;

  } catch (e) {
    // nav interneta, API nestrādā, vai kļūda kodā — skaties konsolē
    kartite.innerHTML = '<span class="kluda">Neizdevās ielādēt: ' + e.message + '</span>';
  }
}
</script>
</body>
</html>
